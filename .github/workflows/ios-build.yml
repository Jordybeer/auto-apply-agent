name: Build IPA

on:
  push:
    branches: [main]
    paths: ['ios/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/JobTide.xcodeproj \
            -scheme JobTide \
            -sdk iphoneos \
            -archivePath build/JobTide.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            EXCLUDED_PLATFORMS=iphonesimulator

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/JobTide.xcarchive/Products/Applications/JobTide.app Payload/
          zip -r JobTide.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: JobTide.ipa
          path: JobTide.ipa
