name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned IPA
        run: |
          xcodebuild -project ios/JobTide.xcodeproj \
            -scheme JobTide \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            build CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/JobTide.app \
            build/Payload/
          cd build && zip -r JobTide.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JobTide-unsigned
          path: build/JobTide.ipa
          retention-days: 7
