name: Build IPA

on:
  push:
    branches: [main]
    paths: ['ios/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "Installed simulator runtimes:"
          xcrun simctl list runtimes

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/JobTide.xcodeproj \
            -scheme JobTide \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/JobTide.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            EXCLUDED_PLATFORMS=iphonesimulator \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO

      - name: Package IPA
        run: |
          ARCHIVE_PATH="build/JobTide.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/JobTide.app"
          
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Error: Archive not found at $ARCHIVE_PATH"
            exit 1
          fi
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found at $APP_PATH"
            ls -la "$ARCHIVE_PATH/Products/Applications/" || echo "Applications directory not found"
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r JobTide.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: JobTide.ipa
          path: JobTide.ipa