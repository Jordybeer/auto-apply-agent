name: Build IPA

on:
  push:
    branches: [main]
    paths: ['ios/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project ios/JobTide.xcodeproj \
            -scheme JobTide \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_SKIP_ASSET_CATALOG_SPECIALIZATION=YES \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData -name "*.app" -path "*/iphoneos/*" | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r JobTide.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: JobTide.ipa
          path: JobTide.ipa
