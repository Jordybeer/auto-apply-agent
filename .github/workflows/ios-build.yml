name: Build IPA

on:
  push:
    branches: [main]
    paths: ['ios/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/JobTide.xcodeproj \
            -scheme JobTide \
            -sdk iphoneos \
            -archivePath build/JobTide.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            EXCLUDED_PLATFORMS=iphonesimulator \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO

      - name: Package IPA
        run: |
          ARCHIVE_PATH="build/JobTide.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/JobTide.app"
          
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Error: Archive not found at $ARCHIVE_PATH"
            exit 1
          fi
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found at $APP_PATH"
            ls -la "$ARCHIVE_PATH/Products/Applications/" || echo "Applications directory not found"
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r JobTide.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: JobTide.ipa
          path: JobTide.ipa